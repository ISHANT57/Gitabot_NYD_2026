services:
  - type: web
    name: dharmabot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python download_index.py && gunicorn --bind=0.0.0.0:$PORT --workers=1 --preload --timeout=300 --keep-alive=5 main:app
    envVars:
      - key: HF_REPO_ID
        value: Ishant57/dharmabot-index
      - key: HF_TOKEN
        sync: false          # Leave blank — repo is public, no token needed on Render
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/stats
