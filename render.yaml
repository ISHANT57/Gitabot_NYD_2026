services:
  - type: web
    name: dharmabot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python download_index.py && gunicorn --bind=0.0.0.0:$PORT --workers=1 --threads=4 --preload --timeout=300 --keep-alive=5 main:app
    envVars:
      - key: HF_REPO_ID
        value: Ishant57/dharmabot-index
      - key: HF_TOKEN
        sync: false          # Leave blank if the index repo is public
      # Embeddings — REQUIRED (used to embed every query at runtime, not just at build)
      - key: MISTRAL_API_KEY
        sync: false
      # Answer generation — primary provider (Groq: fast, generous free tier)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Answer generation — fallback provider
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Answer generation — optional fallback (leave unset if you have no key)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/stats
